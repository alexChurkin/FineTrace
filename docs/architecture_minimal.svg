<text x="153" y="103" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#3949AB">OpenCL · Level Zero API</text>

<!-- intercept arrow -->
<line x1="292" y1="91" x2="326" y2="91" stroke="#E64A19" stroke-width="2" marker-end="url(#ao)"/>

<!-- 1b. FineTrace -->
<rect x="329" y="62" width="276" height="58" rx="6" fill="#6A1B9A" filter="url(#sh)"/>
<rect x="330.5" y="86" width="273" height="32.5" fill="#F3E5F5"/>
<line x1="330.5" y1="86" x2="604.5" y2="86" stroke="#4A148C" stroke-width="0.8"/>
<text x="467" y="79" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="bold" fill="white">FineTrace</text>
<text x="467" y="103" text-anchor="middle" font-family="Segoe UI,Arial" font-size="12" fill="#4A148C">перехват API-вызовов</text>

<!-- arrow process -> UnifiedTracer -->
<line x1="310" y1="120" x2="310" y2="130" stroke="#6A1B9A" stroke-width="2" marker-end="url(#ap)"/>

<!-- 2. UnifiedTracer -->
<rect x="15" y="132" width="590" height="50" rx="7" fill="#2E7D32" filter="url(#sh)"/>
<rect x="16.5" y="156" width="587" height="24.5" fill="#E8F5E9"/>
<line x1="16.5" y1="156" x2="604.5" y2="156" stroke="#1B5E20" stroke-width="0.8"/>
