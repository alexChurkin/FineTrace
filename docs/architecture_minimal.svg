<text x="310" y="234" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11.5" fill="#0D47A1">API · Kernel</text>
<text x="310" y="249" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10.5" fill="#1565C0">перехват Level Zero API</text>

<!-- 3c. Metric Collectors -->
<rect x="415" y="194" width="190" height="66" rx="6" fill="#006064" filter="url(#sh)"/>
<rect x="416.5" y="218" width="187" height="40.5" fill="#E0F7FA"/>
