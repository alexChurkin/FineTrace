<line x1="110" y1="182" x2="110" y2="194" stroke="#2E7D32" stroke-width="2" marker-end="url(#ag)"/>
<line x1="310" y1="182" x2="310" y2="194" stroke="#2E7D32" stroke-width="2" marker-end="url(#ag)"/>
<line x1="510" y1="182" x2="510" y2="194" stroke="#2E7D32" stroke-width="2" marker-end="url(#ag)"/>

