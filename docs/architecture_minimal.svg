<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 345" width="620" height="345">
<defs>
  <filter id="sh"><feDropShadow dx="1" dy="1.5" stdDeviation="2" flood-opacity="0.18"/></filter>
  <marker id="ag"  markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2E7D32"/></marker>
  <marker id="ap"  markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6A1B9A"/></marker>
  <marker id="ao"  markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#E64A19"/></marker>
  <marker id="asl" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#455A64"/></marker>
</defs>
<rect width="620" height="345" fill="#FFFFFF"/>

<!-- 0. CLI -->
<rect x="15" y="12" width="590" height="38" rx="7" fill="#1E1E2E" filter="url(#sh)"/>
<text x="310" y="29" text-anchor="middle" font-family="Consolas,monospace" font-size="13">
  <tspan fill="#A6E22E">$ </tspan><tspan fill="#66D9E8">finetrace</tspan><tspan fill="#F8F8F2"> ./my_app</tspan>
</text>
<text x="310" y="44" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10" fill="#6272A4">LD_PRELOAD · дочерний процесс</text>

<!-- arrow CLI -> process -->
<line x1="310" y1="50" x2="310" y2="60" stroke="#6A1B9A" stroke-width="2" marker-end="url(#ap)"/>

<!-- 1a. Target App -->
<rect x="15" y="62" width="276" height="58" rx="6" fill="#283593" filter="url(#sh)"/>
<rect x="16.5" y="86" width="273" height="32.5" fill="#E8EAF6"/>
