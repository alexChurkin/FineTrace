<text x="110" y="234" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11.5" fill="#7F0000">API · Kernel · Extension</text>
<text x="110" y="249" text-anchor="middle" font-family="Segoe UI,Arial" font-size="10.5" fill="#BF360C">перехват OpenCL API</text>

