<text x="510" y="241" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11.5" fill="#004D40">GPU HW-счётчики</text>

<!-- arrow collectors -> output -->
<line x1="310" y1="260" x2="310" y2="272" stroke="#455A64" stroke-width="2" marker-end="url(#asl)"/>

<!-- 4. Output -->
<rect x="15" y="274" width="590" height="52" rx="7" fill="#263238" filter="url(#sh)"/>
<rect x="16.5" y="298" width="587" height="26.5" fill="#37474F"/>
<line x1="16.5" y1="298" x2="604.5" y2="298" stroke="#1A2327" stroke-width="0.8"/>
<text x="310" y="291" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" font-weight="bold" fill="white">Вывод</text>
<text x="310" y="315" text-anchor="middle" font-family="Segoe UI,Arial" font-size="11.5" fill="#90A4AE">finetrace.{pid}.txt · finetrace.{pid}.json · result.{pid}.csv</text>

